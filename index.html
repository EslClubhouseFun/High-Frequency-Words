:root{
  --u:min(1vh,0.62vw);
  --ink:#1f3b4d; --leaf:#5cc46a; --leafD:#2f8f5b; --sun:#ffd34d; --sunD:#e0a800;
  --coral:#ff6f61; --sky1:#9fdcff; --sky2:#e6f8ff; --pondA:#8fe0c2; --pondB:#4fb894;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* ---------- scenery ---------- */
.cloud{position:fixed;background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:180%;left:12%;bottom:20%}
.cloud::after{width:40%;height:140%;right:12%;bottom:25%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.pond{position:fixed;left:-5vw;right:-5vw;bottom:0;height:23vh;background:linear-gradient(180deg,var(--pondA),var(--pondB));border-radius:50% 50% 0 0/4vh 4vh 0 0;z-index:0;overflow:hidden}
.pond i{position:absolute;height:.7vh;border-radius:9px;background:rgba(255,255,255,.45);animation:ripple 4s ease-in-out infinite}
@keyframes ripple{0%,100%{transform:scaleX(.7);opacity:.3}50%{transform:scaleX(1.1);opacity:.7}}
.reeds{position:fixed;bottom:16vh;z-index:0;font-size:calc(var(--u)*9)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;z-index:1}
.screen.on{display:flex}

/* ---------- home ---------- */
#home{align-items:center;justify-content:center;gap:4vw;padding:2vh 4vw 21vh}
.hero{display:flex;flex-direction:column;align-items:center;position:relative}
.hero .bubble-say{background:#fff;font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*3.4);padding:calc(var(--u)*1.3) calc(var(--u)*2.6);border-radius:calc(var(--u)*3);position:relative;margin-bottom:calc(var(--u)*1.5);box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.08)}
.hero .bubble-say::after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-1.6);transform:translateX(-50%);border:calc(var(--u)*1.7) solid transparent;border-top-color:#fff;border-bottom:0}
.hero .frog{width:calc(var(--u)*36);animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 calc(var(--u)*1.2) 0 rgba(0,0,0,.08))}
h1{font-family:'Fredoka';font-weight:700;font-size:calc(var(--u)*11);line-height:.95;margin:calc(var(--u)*1.5) 0 0;color:#fff;text-align:center;text-shadow:0 calc(var(--u)*.9) 0 var(--leafD),0 calc(var(--u)*2) calc(var(--u)*2) rgba(0,0,0,.12)}
.sub{margin-top:calc(var(--u)*2.2);background:#fff;color:var(--leafD);font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*3.6);padding:calc(var(--u)*.9) calc(var(--u)*3);border-radius:999px;box-shadow:0 calc(var(--u)*.7) 0 rgba(47,143,91,.25)}
.panel{background:rgba(255,255,255,.88);border-radius:calc(var(--u)*4.5);padding:calc(var(--u)*3.2);box-shadow:0 calc(var(--u)*1.4) calc(var(--u)*3) rgba(31,59,77,.12);width:min(54vw,calc(var(--u)*92))}
.plabel{font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*2.8);color:#6b8796;margin:0 0 calc(var(--u)*1.2) calc(var(--u)*.5)}
.levels{display:flex;gap:calc(var(--u)*1.4);flex-wrap:wrap}
.chip{font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*3.3);padding:calc(var(--u)*1.1) calc(var(--u)*2.6);border-radius:999px;border:calc(var(--u)*.55) solid var(--c);background:#fff;color:var(--c);transition:transform .1s}
.chip.on{background:var(--c);color:#fff;box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.15)}
.chip:active{transform:scale(.94)}
.peek{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.9);margin:calc(var(--u)*1) 0 0;min-height:calc(var(--u)*5)}
.peek em{font-style:normal;font-weight:800;font-size:calc(var(--u)*2.4);color:#6b8796;align-self:center;margin-left:calc(var(--u)*.6)}
.chip.wk{width:calc(var(--u)*7.4);height:calc(var(--u)*7.4);padding:0;border-radius:50%;display:grid;place-items:center;position:relative;font-size:calc(var(--u)*3.3)}
.chip.wk i{position:absolute;top:calc(var(--u)*-1.4);right:calc(var(--u)*-1.2);font-style:normal;font-size:calc(var(--u)*2.8)}
.wkhead{font-family:'Fredoka';font-weight:500;font-size:calc(var(--u)*3);color:#6b8796;margin-top:calc(var(--u)*2.2)}
.wkhead b{font-weight:600}
.peek span{font-family:'Fredoka';font-weight:500;font-size:calc(var(--u)*2.6);background:#eef7f2;color:var(--leafD);padding:calc(var(--u)*.4) calc(var(--u)*1.6);border-radius:calc(var(--u)*1.6)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.2);margin-top:calc(var(--u)*2.8)}
.mode{display:flex;align-items:center;gap:calc(var(--u)*1.8);padding:calc(var(--u)*2.1) calc(var(--u)*2.4);border-radius:calc(var(--u)*3.4);border:none;background:var(--bg);color:#fff;box-shadow:0 calc(var(--u)*1.1) 0 var(--sh);text-align:left;transition:transform .08s,box-shadow .08s}
.mode:active{transform:translateY(calc(var(--u)*.9));box-shadow:0 calc(var(--u)*.2) 0 var(--sh)}
.mode .ico{font-size:calc(var(--u)*7);line-height:1;flex:none}
.mode b{display:block;font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*3.9);line-height:1.1}
.mode small{display:block;font-weight:800;font-size:calc(var(--u)*2.3);opacity:.95;margin-top:calc(var(--u)*.4)}
.gear{position:absolute;top:2.4vh;right:2.4vw}
.brand{position:absolute;bottom:2vh;left:0;right:0;text-align:center;font-family:'Fredoka';font-weight:500;color:rgba(255,255,255,.95);font-size:calc(var(--u)*2.4);letter-spacing:.04em}

/* ---------- shared buttons ---------- */
.ibtn{width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;background:#fff;border:none;font-size:calc(var(--u)*4.4);display:grid;place-items:center;box-shadow:0 calc(var(--u)*.8) 0 rgba(31,59,77,.15);flex:none}
.ibtn:active{transform:translateY(calc(var(--u)*.6));box-shadow:0 calc(var(--u)*.2) 0 rgba(31,59,77,.15)}

/* ---------- game ---------- */
#game{flex-direction:column}
.top{height:12vh;flex:none;display:flex;align-items:center;gap:1.6vw;padding:0 2.4vw}
.tpill{font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*3.6);background:#fff;padding:calc(var(--u)*1.2) calc(var(--u)*3);border-radius:999px;box-shadow:0 calc(var(--u)*.8) 0 rgba(31,59,77,.12)}
.spacer{flex:1}
#starpill{display:flex;align-items:center;gap:calc(var(--u)*1)}
#starpill .n{color:var(--sunD)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;padding:0 3vw 1vh;position:relative;min-height:0}
.track{height:23vh;flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:calc(var(--pad)*.22);padding-top:3vh}

.prompt{display:flex;align-items:center;gap:calc(var(--u)*2.4);background:#fff;border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*4) calc(var(--u)*1.3) calc(var(--u)*1.3);box-shadow:0 calc(var(--u)*1) calc(var(--u)*2) rgba(31,59,77,.12)}
.speak{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;background:var(--sun);border:none;font-size:calc(var(--u)*5.4);box-shadow:0 calc(var(--u)*.9) 0 var(--sunD);flex:none;position:relative}
.speak:active{transform:translateY(calc(var(--u)*.7));box-shadow:0 calc(var(--u)*.2) 0 var(--sunD)}
.speak.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:calc(var(--u)*.7) solid var(--sun);animation:ring .7s ease-out}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.6);opacity:0}}
.ptext{font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*4.6)}
.ptext .tw{display:inline-block;background:#e9f7ff;color:#1a7fc1;padding:0 calc(var(--u)*1.8);border-radius:calc(var(--u)*2);font-size:calc(var(--u)*6);vertical-align:middle;margin:0 calc(var(--u)*.6)}
.dots{display:flex;gap:calc(var(--u)*.9);margin-left:calc(var(--u)*1)}
.dots i{width:calc(var(--u)*3);height:calc(var(--u)*3);border-radius:50%;background:#e2edf2}
.dots i.on{background:var(--leaf)}

.cards{display:flex;gap:2.6vw;justify-content:center}
.card{min-width:calc(var(--u)*26);height:calc(var(--u)*24);padding:0 calc(var(--u)*3.4);border-radius:calc(var(--u)*4);background:#fff;border:none;box-shadow:0 calc(var(--u)*1.4) 0 #c3d8e4;font-family:'Fredoka';font-weight:600;font-size:calc(var(--u)*10);transition:transform .1s,opacity .3s,background .2s}
.cards.c4 .card{font-size:calc(var(--u)*8);min-width:calc(var(--u)*22);height:calc(var(--u)*21)}
.card:active{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.4) 0 #c3d8e4}
.card.right{background:#6fd67c;color:#fff;box-shadow:0 calc(var(--u)*1.4) 0 #3a9f50;animation:pop .45s}
.card.wrong{animation:shake .42s}
.card.dim{opacity:.3;pointer-events:none}
.card.in{animation:cardin .4s both}
@keyframes cardin{from{transform:translateY(4vh) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2vw)}40%{transform:translateX(1.6vw)}60%{transform:translateX(-1.1vw)}80%{transform:translateX(.6vw)}}

/* fill the gap */

<script>
/* ================= TERM 2 PLAN · K2 =================
   One entry per week: w = high frequency words, s = reading sentences.
   Sentence: [sentence, word to hide in Fill the Gap (null = reading only), [2 wrong choices], picture]
   Review weeks reuse the words and sentences of the weeks they list. */
const PAL=['#f2665a','#f19a1c','#2f9ae0','#9a64e8','#3fb56a','#e85a9a','#14a3a3'];
const PLAN = {
  /* Week 1: "HFW 1" set. The overview had no sentences, so these were written to match the words */
  1:{w:['all','who','we','look','like','this','me','my'], s:[
    ['Who is at the door?','who',['my','me'],'🚪'],
    ['Look at me!','look',['who','my'],'🙋'],
    ['I like my cat.','like',['all','who'],'🐱'],
    ['This is my dog.','this',['we','me'],'🐶'],
    ['We are friends.','we',['this','my'],'🧒🧒'],
    ['We all like apples.','all',['this','me'],'🍎'],
    ['Can you help me?','me',['my','look'],'🤝']]},
  2:{w:['yes','are','mum','dad','at','big','come'], s:[
    ['My mum will come home at seven.','come',['dad','yes'],'🏠🕖'],
    ['My mum and dad are happy.','are',['big','at'],'👩👨😊'],
    ['Do you want a big cake?','big',['come','yes'],'🎂'],
    ['Yes, I do.','yes',['at','are'],'👍']]},
  3:{w:['yes','are','mum','dad','at','big','come'], s:[
    ['My mum is happy and my dad is sad.','dad',['big','come'],'😊😢'],
    ['I can draw a big apple and a small apple.','big',['are','at'],'🍎🍏'],
    ['Bats come at night.','come',['mum','yes'],'🦇🌙'],
    ['You see the sun in the day.',null,null,'☀️']]},
  4:{w:['do',"don't",'what'], s:[
    ['What colour is your pencil?','what',['do',"don't"],'✏️'],
    ['My pencil is red.',null,null,'🖍️'],
    ['Do you like this book?','do',['what','big'],'📖'],
    ["No, I don't like it.","don't",['what','at'],'🙅']]},
  5:{w:['do',"don't",'what','where'], s:[
    ['What is in the big box?','what',['do',"don't"],'📦'],
    ['It is a big blue ball.','big',['what',"don't"],'🔵'],
    ['Where is the box?','where',['do',"don't"],'📦'],
    ['It is on the bed.',null,null,'🛏️'],
    ["I don't like that ball.","don't",['what','where'],'⚽']]},
  6:{review:[2,3,4,5]},
  7:{w:['do',"don't",'what','where','why'], s:[
    ['Do you like the monkey?','do',['where','what'],'🐒'],
    ["No, I don't like the monkey.","don't",['why','where'],'🐒'],
    ["Why don't we go see a tiger?",'why',['do',"don't"],'🐯'],
    ['Where are the tigers?','where',['do',"don't"],'🐯🐯'],
    ['There are tigers at the zoo.','at',['why',"don't"],'🐯🦒']]},
  8:{w:['how','up','down'], s:[
    ['How old is the dog?','how',['up','down'],'🐶'],
    ['It is three years old.',null,null,'🎂'],
    ['My dog likes to jump up and down.','up',['how','why'],'🐕'],
    ["I don't like dogs, I like cats.","don't",['how','up'],'🐱']]},
  9:{review:[2,3,4,5,7,8]},
  10:{w:['how','up','down','small'], s:[
    ['The sun comes up and down in the sky.','up',['how','small'],'🌅'],
    ['The tree is big and the rock is small.','small',['how','what'],'🌳🪨'],
    ['How old is the small tree?','how',['up','down'],'🌱'],
    ['The small tree is ten.','small',['how','up'],'🌱'],
    ['How old is the big tree?','how',['down','small'],'🌳']]},
  11:{w:['how','up','down','small','has'], s:[
    ['The sky has a big moon.','has',['how','up'],'🌕'],
    ['I see a star up in the sky.','up',['how','has'],'⭐'],
    ['The sky has a big sun.','has',['small','how'],'☀️'],
    ['I see a cloud in the sky.',null,null,'☁️'],
    ['I see the sun in the sky.',null,null,'☀️']]},
  12:{w:['have','because','but'], s:[
    ['Have you seen the doctor?','have',['because','but'],'🧑‍⚕️'],
    ['Yes, I have.','have',['but','because'],'👍'],
    ['Why did you see the doctor?','why',['have','but'],'🩺'],
    ['Because I am sick.','because',['have','up'],'🤒']]},
  13:{w:['have','because','but','there'], s:[
    ["Why don't you go to the zoo?",'why',['have','there'],'🦁'],
    ["Because I don't like it there.",'there',['have','because'],'🙅'],
    ["I like the elephant but I don't like the tiger.",'but',['have','there'],'🐘🐯'],
    ['There is a big tiger at the zoo.','there',['because','but'],'🐯']]},
  /* Week 14: only the first two sentences were readable in the screenshot */
  14:{w:['have','because','but','there','here'], s:[
    ['Have you seen the farmer?','have',['here','there'],'🧑‍🌾'],
    ['Here is the farmer.','here',['because','have'],'🧑‍🌾']]},
  15:{w:['do',"don't",'what','where','why','how','up','down','small','has','have','because','but','there','here'], s:[
    ['I see a doctor and a nurse.',null,null,'🧑‍⚕️'],
    ["I like the nurse but I don't like the doctor.",'but',['here','has'],'🧑‍⚕️'],
    ["Why don't you like the doctor?",'why',['here','has'],'🧑‍⚕️'],
    ['Because she is angry.','because',['has','up'],'😠']]},
  16:{review:'all'}
};
const WEEKS={};
Object.keys(PLAN).map(Number).sort((a,b)=>a-b).forEach((k,ix)=>{
  const p=PLAN[k]; let w=[],s=[],from=null;
  if(p.review){
    from = p.review==='all' ? Object.keys(WEEKS).map(Number).filter(n=>!WEEKS[n].review) : p.review;
    from.forEach(n=>{ WEEKS[n].w.forEach(x=>{ if(!w.includes(x)) w.push(x); }); s=s.concat(WEEKS[n].s); });
  } else { w=p.w; s=p.s.map(([t,g,d,e])=>({t,g,d,e})); }
  WEEKS[k]={w,s,review:!!p.review,from,c:PAL[ix%PAL.length]};
});
/* Optional: your own recorded voice clips. Add like  AUDIO['the'] = 'data:audio/mpeg;base64,...';
   Any word with a clip plays the recording instead of the computer voice. */
const AUDIO = {};

const ALL = [...new Set(Object.values(WEEKS).flatMap(x=>x.w))];
const MODES = {tap:'Listen & Tap', pop:'Bubble Pop', fill:'Fill the Gap', flash:'Flash Cards'};
const PRAISE = ['Great job!','Super!','You got it!','Well done!','Awesome!','Fantastic!','Yes!'];

/* ================= ART ================= */
const FROG = `<svg viewBox="0 0 120 104" xmlns="http://www.w3.org/2000/svg">

<ellipse cx="60" cy="77" rx="30" ry="17" fill="#c9f2b0"/>
<circle cx="35" cy="34" r="19" fill="#5cc46a"/><circle cx="85" cy="34" r="19" fill="#5cc46a"/>
<circle cx="35" cy="34" r="13" fill="#fff"/><circle cx="85" cy="34" r="13" fill="#fff"/>
<circle cx="37" cy="36" r="7" fill="#1f2d3d"/><circle cx="87" cy="36" r="7" fill="#1f2d3d"/>
<circle cx="39.5" cy="33" r="2.6" fill="#fff"/><circle cx="89.5" cy="33" r="2.6" fill="#fff"/>

/* ================= SETTINGS ================= */
const KEY='hopSightWords.term2';
const DEF={week:1,rounds:8,choices:3,rate:0.8,autoSay:false};
let S=Object.assign({},DEF);
try{const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j) S=Object.assign(S,j);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!WEEKS[S.week]) S.week=2;
const pool = () => WEEKS[S.week].w;

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const pickOne = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQueue(words,n){
  if(!words.length) return [];
  const q=[];
  while(q.length<n){
    const s=shuffle(words.slice());
    if(q.length && s.length>1 && s[0]===q[q.length-1]) [s[0],s[s.length-1]]=[s[s.length-1],s[0]];
    q.push(...s);
  }
  return q.slice(0,n);
}
function later(fn,ms){const g=G; return setTimeout(()=>{ if(g && G===g) fn(); },ms);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ================= SOUND ================= */
let AC=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(C) try{AC=new C()}catch(e){}}
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,type='sine',vol=.2,when=0,slide=0){
  const a=ac(); if(!a) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const SFX={
  tap(){tone(660,.07,'sine',.12)},
  right(){[523,659,784].forEach((f,i)=>tone(f,.28,'triangle',.22,i*.09))},
  wrong(){tone(230,.32,'square',.07,0,150)},
  pop(){tone(880,.13,'sine',.28,0,260);tone(1400,.05,'triangle',.08,0)},
  hop(){tone(320,.22,'sine',.2,0,760)},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.32,'triangle',.22,i*.13))}
};

/* ================= VOICE ================= */
let VOICE=null, unlocked=false, curAudio=null;
const hasTTS='speechSynthesis' in window;
function pickVoice(){
  if(!hasTTS) return;
  const vs=speechSynthesis.getVoices(), en=vs.filter(v=>/^en[-_]US/i.test(v.lang));
  VOICE=en.find(v=>/Samantha/i.test(v.name))||en.find(v=>v.localService)||en[0]||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(hasTTS){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function unlock(){
  ac();
  if(unlocked||!hasTTS) return; unlocked=true;
  const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);
}
function stopVoice(){
  if(curAudio){curAudio.pause();curAudio=null}
  if(hasTTS) speechSynthesis.cancel();
}
function tts(text){
  if(!hasTTS) return;
  stopVoice();
  setTimeout(()=>{ // Safari drops a speak() that follows cancel() too closely
    const u=new SpeechSynthesisUtterance(text);
    if(VOICE) u.voice=VOICE; u.lang='en-US'; u.rate=S.rate; u.pitch=1.1;
    speechSynthesis.speak(u);
  },60);
}
/* say a single word (uses a recording if one exists), then optional follow-up speech */
function sayWord(w,after){
  if(AUDIO[w]){
    stopVoice(); curAudio=new Audio(AUDIO[w]);
    if(after) curAudio.onended=()=>tts(after);
    curAudio.play().catch(()=>{});
  } else tts(after? `${w}. ${after}` : w);
}

/* ================= HOME ================= */
function weekRange(W){ return `${W.from[0]}–${W.from[W.from.length-1]}`; }
function renderHome(){
  const box=$('#levels'); box.innerHTML='';
  Object.keys(WEEKS).forEach(k=>{

    b.setAttribute('aria-label','Week '+k);

    box.appendChild(b);
  });
  const W=WEEKS[S.week];
  $('#wkhead').innerHTML=`<b style="color:${W.c}">Week ${S.week}</b>`+(W.review?` · Review of weeks ${weekRange(W)}`:'');
  $('#peek').innerHTML=W.w.map(w=>`<span>${w}</span>`).join('')+`<em>+ ${W.s.length} sentences</em>`;
}
$('#homeFrog').innerHTML=FROG; $('#winFrog').innerHTML=FROG;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{SFX.tap(); startGame(b.dataset.mode)});
$('#homeBtn').onclick=()=>{SFX.tap(); stopVoice(); G=null; renderHome(); show('home')};

/* ================= GAME ================= */
let G=null;
function startGame(mode,override){
  unlock();
  const words=(override&&override.length)?override:pool();
  let src=words;
  if(mode==='fill'){
    const all=WEEKS[S.week].s.filter(x=>x.g);
    src = override ? all.filter(x=>override.includes(x.g)) : all;
    if(!src.length){ toast('No gap sentences this week'); return; }
  }
  G={mode,words,override:override||null,i:0,stars:0,streak:0,missed:new Set(),busy:false,firstTry:true};
  $('#mtitle').textContent=MODES[mode];
  show('game');
  if(mode==='flash'){
    G.fkind='words'; G.q=shuffle(words.slice());
    $('#track').style.visibility='hidden'; $('#starpill').style.visibility='hidden';
    renderFlash(); return;
  }
  $('#track').style.visibility=''; $('#starpill').style.visibility='';
  const n = override ? Math.min(S.rounds, Math.max(4, src.length*2)) : S.rounds;
  G.q=makeQueue(src,n);
  buildTrack(G.q.length);
  updateHUD();
  requestAnimationFrame(()=>{placeFrog(0,false); renderRound();});
}
function updateHUD(){ $('#starN').textContent=G.stars; }

function distractors(t,n){
  let p=shuffle(G.words.filter(w=>w!==t));
  if(p.length<n) p=p.concat(shuffle(ALL.filter(w=>w!==t && !p.includes(w))));
  return p.slice(0,n);
}
function renderRound(){
  G.firstTry=true; G.busy=false;
  const it=G.q[G.i], st=$('#stage');
  if(G.mode==='fill'){ G.sent=it; G.target=it.g; } else G.target=it;
  const t=G.target;
  st.innerHTML='';
  if(G.mode==='tap') roundTap(st,t);
  else if(G.mode==='pop') roundPop(st,t);
  else roundFill(st,G.sent);
}
function speakBtn(btn,fn){
  btn.onclick=()=>{ if(G.busy) return; btn.classList.remove('ring'); void btn.offsetWidth; btn.classList.add('ring'); fn(); };
}
const capFirst = w => w.charAt(0).toUpperCase()+w.slice(1);
function addCards(box,opts,t,label){
  opts.forEach((w,k)=>{
    const b=document.createElement('button');
    b.className='card in'; b.style.animationDelay=(k*.07)+'s'; b.textContent=label?label(w):w;
    b.onclick=()=>{ if(G.busy) return; w===t ? good(b) : bad(b); };
    b.addEventListener('animationend',e=>{ if(e.animationName==='cardin'){b.classList.remove('in'); b.style.animationDelay='';} });
    box.appendChild(b);
  });
}

/* --- Listen & Tap --- */
function roundTap(st,t){
  st.innerHTML=`<div class="prompt"><button class="speak emo" aria-label="Hear the word">🔊</button><div class="ptext">Listen and tap the word!</div></div><div class="cards c${S.choices}"></div>`;
  speakBtn(st.querySelector('.speak'),()=>sayWord(t));
  addCards(st.querySelector('.cards'), shuffle([t,...distractors(t,S.choices-1)]), t);
  later(()=>sayWord(t),400);
}

/* --- Bubble Pop --- */
function sayPop(){ AUDIO[G.target] ? sayWord(G.target) : tts(`Pop every ${G.target}!`); }
function roundPop(st,t){
  st.innerHTML=`<div class="prompt"><button class="speak emo" aria-label="Hear the word">🔊</button><div class="ptext">Pop every <span class="tw">${t}</span></div><div class="dots"><i></i><i></i><i></i></div></div><div class="bubbles"></div>`;
  speakBtn(st.querySelector('.speak'),sayPop);
  const NT=3, NB=8, ds=distractors(t,3);
  const items=shuffle([t,t,t,...Array.from({length:NB-NT},(_,i)=>ds[i%ds.length])]);
  const box=st.querySelector('.bubbles');
  box.style.setProperty('--b',`min(19vh,14.5vw)`);
  const cols=4, rows=2, hues=[195,330,50,140,270,20,170,300];
  items.forEach((w,k)=>{
    const c=k%cols, r=Math.floor(k/cols), b=document.createElement('button');
    b.className='bubble';
    b.textContent=w;
    b.style.left=((c+.5)/cols*100+(Math.random()-.5)*7)+'%';
    b.style.top=((r+.5)/rows*100+(Math.random()-.5)*12)+'%';
    b.style.setProperty('--h',hues[k%hues.length]);
    b.style.animationDelay=(-Math.random()*3.4)+'s';
    b.onclick=()=>popPick(b,w===t);
    box.appendChild(b);
  });
  G.popped=0; G.need=NT;
  later(sayPop,400);
}
function popPick(b,ok){
  if(G.busy||b.classList.contains('popped')) return;
  if(!ok){
    bad(b);
    setTimeout(()=>b.classList.remove('wrong'),450);
    return;
  }
  SFX.pop(); burst(b,4); b.classList.add('popped');
  G.popped++;
  document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k<G.popped));
  if(G.popped>=G.need) good(null);
}

/* --- Fill the Gap --- */
function splitGap(t,g){
  const m=new RegExp("(^|[^A-Za-z'])("+g+")(?![A-Za-z'])","i").exec(t);
  if(!m) return [t,'',''];
  const k=m.index+m[1].length;
  return [t.slice(0,k), t.slice(k,k+g.length), t.slice(k+g.length)];
}
function sayFill(){ const [a,,b]=splitGap(G.sent.t,G.sent.g); tts(a+', blank, '+b); }
function roundFill(st,d){
  const [a,word,b]=splitGap(d.t,d.g); G.gapWord=word;
  st.innerHTML=`<div class="fillrow"><div class="pic emo">${d.e}</div><div class="sent${d.t.length>30?' long':''}">${a}<span class="gap${/^[.,!?]/.test(b)?' tight':''}">?</span>${b}</div><button class="speak emo" aria-label="Hear the sentence">🔊</button></div><div class="cards c3"></div>`;
  speakBtn(st.querySelector('.speak'),sayFill);
  /* gap at the start of the sentence → every choice gets a capital letter */
  const atStart = a.trim()==='';
  addCards(st.querySelector('.cards'), shuffle([d.g,...d.d]), d.g, atStart?capFirst:null);
  later(sayFill,400);
}

/* --- right / wrong --- */
function good(el){
  G.busy=true; SFX.right();
  if(el){ el.classList.add('right'); burst(el,10); }
  if(G.firstTry){ G.stars++; G.streak++; if([3,5,8,10,15].includes(G.streak)) toast(`⭐ ${G.streak} in a row!`); }
  else G.streak=0;
  updateHUD();
  const praise=pickOne(PRAISE), t=G.target;
  let wait=1100;
  if(G.mode==='fill'){
    const g=$('.gap'); g.textContent=G.gapWord; g.classList.add('done');
    tts(G.sent.t+' '+praise); wait=2200;
  } else sayWord(t,praise);
  later(()=>{ hopTo(G.i+1); later(nextRound,800); },wait);
}
function bad(el){
  SFX.wrong();
  if(G.firstTry) G.missed.add(G.target);
  G.firstTry=false; G.streak=0;
  el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
  if(G.mode!=='pop') setTimeout(()=>el.classList.add('dim'),430);
  later(()=>{ if(G.busy) return; G.mode==='fill'?sayFill():G.mode==='pop'?sayPop():sayWord(G.target); },550);
}
function nextRound(){
  if(!G) return;
  G.i++;
  if(G.i>=G.q.length) finish(); else renderRound();
}

/* --- track --- */
function buildTrack(n){
  const tr=$('#track'); tr.innerHTML='';
  const pads=n+1;
  const size=Math.min(innerWidth*.92/(pads*1.22), innerHeight*.14);
  tr.style.setProperty('--pad',size+'px');
  for(let i=0;i<pads;i++){
    const p=document.createElement('div');
    p.className='pad'+(i===pads-1?' goal':'');
    p.innerHTML=LILY+(i===pads-1?'<span class="trophy emo">🏆</span>':'<span class="flower emo">🌸</span>');
    tr.appendChild(p);
  }
  const f=document.createElement('div'); f.id='tfrog'; f.innerHTML=`<div class="fin">${FROG}</div>`;
  tr.appendChild(f);
}
function placeFrog(i,anim){
  const pads=document.querySelectorAll('#track .pad'), f=$('#tfrog');
  const p=pads[Math.min(i,pads.length-1)]; if(!p||!f) return;
  f.style.transition=anim?'left .6s ease-in-out, top .6s ease-in-out':'none';
  f.style.left=(p.offsetLeft+p.offsetWidth/2)+'px';
  f.style.top=(p.offsetTop+p.offsetHeight*.5)+'px';
  pads.forEach((pd,k)=>pd.classList.toggle('done',k<i));
}
function hopTo(i){
  SFX.hop();
  const f=$('#tfrog'); if(!f) return;
  f.classList.remove('jump'); void f.offsetWidth; f.classList.add('jump');
  placeFrog(i,true);
}
addEventListener('resize',()=>{
  if(G && G.mode!=='flash' && $('#game').classList.contains('on')){ buildTrack(G.q.length); placeFrog(G.i,false); }
});

/* --- finish --- */
function finish(){
  const total=G.q.length, missed=[...G.missed];
  SFX.win(); confetti();
  const r=G.stars/total;
  $('#wtitle').textContent = r===1?'Perfect!':r>=.7?'Hooray!':'Good try!';
  $('#wstars').innerHTML=`<span class="emo">⭐</span> <span class="n">${G.stars}</span> / ${total} stars`;
  $('#wmiss').innerHTML = missed.length
    ? `Let's practise these words:<div class="list">${missed.map(w=>`<button data-w="${w}">${w}</button>`).join('')}</div>`
    : `You read every word first time! <span class="emo">🎉</span>`;
  $('#wmiss').querySelectorAll('button').forEach(b=>b.onclick=()=>sayWord(b.dataset.w));
  const mode=G.mode, words=G.override;
  $('#wbtns').innerHTML='';
  const mk=(txt,bg,sh,fn)=>{const b=document.createElement('button'); b.className='big'; b.innerHTML=txt; b.style.setProperty('--bg',bg); b.style.setProperty('--sh',sh); b.onclick=()=>{SFX.tap();fn()}; $('#wbtns').appendChild(b);};
  mk('<span class="emo">▶️</span> Play again','#5cc46a','#2f8f5b',()=>startGame(mode,words));
  if(missed.length) mk('<span class="emo">🔁</span> Practise missed words','#ff8a5c','#d9602f',()=>startGame(mode,missed));
  mk('<span class="emo">🏠</span> Home','#4fb3f0','#2687c4',()=>{G=null;renderHome();show('home')});
  show('win');
  later(()=>tts(`${$('#wtitle').textContent} You got ${G.stars} stars!`),500);
}

/* --- Flash cards --- */
function hl(text,words){
  const alts=words.slice().sort((x,y)=>y.length-x.length).join('|');
  return text.replace(new RegExp("(^|[^A-Za-z'])("+alts+")(?![A-Za-z'])","gi"),'$1<b>$2</b>');
}
function setFlashKind(kind){
  if(G.fkind===kind) return;
  SFX.tap(); G.fkind=kind; G.i=0;
  G.q = kind==='words' ? shuffle(G.words.slice()) : WEEKS[S.week].s.slice();
  renderFlash();
}
function flashSay(){ const it=G.q[G.i]; G.fkind==='sents' ? tts(it.t) : sayWord(it); }
function renderFlash(){
  const st=$('#stage'), it=G.q[G.i], W=WEEKS[S.week], last=G.i===G.q.length-1, isS=G.fkind==='sents';
  const face = isS ? `<span class="fe emo">${it.e}</span><span class="fs">${hl(it.t,W.w)}</span>` : `<span class="fw">${it}</span>`;
  st.innerHTML=`<div class="flashwrap">
    <button class="nav prev" aria-label="Back" ${G.i===0?'disabled':''}>${ARROW_L}</button>
    <button class="flash in${isS?' sents':''}" style="--c:${W.c}"><span class="lv">Week ${S.week}</span>${face}<span class="hint">tap to hear</span></button>
    <button class="nav next" aria-label="Next">${last?'<span class="emo">🎉</span>':ARROW_R}</button></div>
    <div class="fbar"><div class="seg fseg"><button data-k="words" class="${isS?'':'on'}">Words</button><button data-k="sents" class="${isS?'on':''}">Sentences</button></div><span class="count">${G.i+1} / ${G.q.length}</span><button class="small shuf emo">🔀 Shuffle</button></div>`;
  const card=st.querySelector('.flash');
  card.onclick=()=>{ card.classList.remove('say','in'); void card.offsetWidth; card.classList.add('say'); flashSay(); };
  st.querySelector('.prev').onclick=()=>{ if(G.i>0){SFX.tap(); G.i--; renderFlash();} };
  st.querySelector('.next').onclick=flashNext;
  st.querySelector('.shuf').onclick=()=>{ SFX.tap(); shuffle(G.q); G.i=0; renderFlash(); };
  st.querySelectorAll('.fseg button').forEach(b=>b.onclick=()=>setFlashKind(b.dataset.k));
  let sx=null;
  card.addEventListener('pointerdown',e=>sx=e.clientX);
  card.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null;
    if(dx<-70){ flashNext(); } else if(dx>70 && G.i>0){ G.i--; renderFlash(); } });
  if(S.autoSay) later(flashSay,350);
}
function flashNext(){
  if(G.i<G.q.length-1){ SFX.tap(); G.i++; renderFlash(); }
  else { SFX.win(); confetti(); tts('Great reading!'); G.i=0; later(renderFlash,900); }
}

/* ================= FX ================= */
function burst(el,n){
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let k=0;k<n;k++){
    const s=document.createElement('div'); s.className='spark emo';
    s.textContent=pickOne(['⭐','✨','🌟','💚']);
    const a=k/n*Math.PI*2+Math.random()*.5, d=r.width*.55+Math.random()*60;
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}
function confetti(){
  const cols=['#ff6f61','#ffd34d','#5cc46a','#4fb3f0','#a77bf0','#ff8fa0'];
  for(let k=0;k<90;k++){
    const c=document.createElement('div'); c.className='conf';
    c.style.left=Math.random()*100+'vw'; c.style.background=pickOne(cols);
    c.style.animationDuration=(2.2+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.6)+'s';
    c.style.setProperty('--r',(Math.random()*900-450)+'deg');
    document.body.appendChild(c); setTimeout(()=>c.remove(),4800);
  }
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1900);
}

/* ================= SCENERY ================= */
(function(){
  const pond=$('#pond');
  for(let k=0;k<7;k++){
    const i=document.createElement('i');
    i.style.left=(8+k*13+Math.random()*5)+'%'; i.style.top=(25+Math.random()*60)+'%';
    i.style.width=(4+Math.random()*6)+'vw'; i.style.animationDelay=(-Math.random()*4)+'s';
    pond.appendChild(i);
  }
  [[6,14,62],[22,8,95],[36,11,78]].forEach(([top,h,dur],k)=>{
    const c=document.createElement('div'); c.className='cloud';
    c.style.top=top+'vh'; c.style.height=h/2+'vh'; c.style.width=h*1.6+'vh';
    c.style.animationDuration=dur+'s'; c.style.animationDelay=(-dur*(k*.33+.1))+'s';
    document.body.insertBefore(c,document.body.firstChild);
  });
})();
document.addEventListener('pointerdown',()=>ac(),{once:true});
renderHome();
</script>
